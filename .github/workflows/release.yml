name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: serialtalkerlogger
          - os: macos-latest
            artifact: serialtalkerlogger
          - os: windows-latest
            artifact: serialtalkerlogger
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Determine project version
        id: version
        shell: bash
        run: |
          VER=$(./gradlew -q properties --configuration all | grep "^version:" | awk '{print $2}')
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: serialtalkerlogger-${{ steps.version.outputs.version }}.jar
          path: build/libs/serialtalkerlogger-${{ steps.version.outputs.version }}.jar

  create-release:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Create Release Notes
        id: release-notes
        run: |
          NOTES="# Release ${{ steps.version.outputs.version }}"
          echo "$NOTES" > /tmp/release-notes.txt
          echo "See CHANGELOG.md for detailed changes." >> /tmp/release-notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: /tmp/release-notes.txt
          files: |
            artifacts/serialtalkerlogger-*.jar/*.jar
            artifacts/package-linux-*/**/*.deb
            artifacts/package-linux-*/**/*.AppImage
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
